name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[qdrant,chroma,pgvector,langchain,pdf,dev]"
      - name: Unit tests + store conformance (memory, qdrant, chroma, langchain)
        run: pytest -q

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: jev_retrieval
          POSTGRES_DB: jev_retrieval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[pgvector,dev]"
      - name: Store conformance against Postgres + pgvector
        env:
          JEV_RETRIEVAL_TEST_PG_DSN: postgresql://postgres:jev_retrieval@localhost:5432/jev_retrieval
        run: pytest -q tests/stores -k pgvector
